name: Smart Queue CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript Syntax
        run: |
          node --check app.js
          node --check tests/app.test.js

      - name: Execute Automated Test Suite
        run: npm test

  docker:
    name: Build & Validate Docker Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t smart-queue:ci .

      - name: Test Container Health & HTTP Response
        run: |
          docker run -d -p 8080:80 --name smart-queue-test smart-queue:ci
          sleep 3
          curl --fail --silent --show-error http://localhost:8080/ | grep -E -q "SmartQueue|CareQueue"
          echo "Docker container successfully responded with valid Smart Queue application HTML!"
          docker stop smart-queue-test
          docker rm smart-queue-test
